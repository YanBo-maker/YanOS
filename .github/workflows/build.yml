name: Build and test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / ${{ matrix.config }} / sanitizers=${{ matrix.sanitizers }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            config: Debug
            sanitizers: "ON"
          - os: ubuntu-22.04
            config: Release
            sanitizers: "OFF"
          - os: windows-2022
            config: Debug
            sanitizers: "OFF"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install RISC-V toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-riscv64-linux-gnu
          riscv64-linux-gnu-gcc --version
          dpkg-query -W gcc-11-riscv64-linux-gnu
      - name: Configure
        if: runner.os != 'Linux'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.config }} -DYAN_ENABLE_SANITIZERS=${{ matrix.sanitizers }}
      - name: Install semantic/MCP deps (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          deps="$RUNNER_TEMP/yan-deps"
          mkdir -p "$deps/src" && cd "$deps/src"
          yy=6447536015f3d600f3d65323b10976103b337ca7
          curl -fsSL -o curl.tar.xz https://curl.se/download/curl-8.23.0.tar.xz
          curl -fsSL -o yyjson.tar.gz "https://codeload.github.com/ibireme/yyjson/tar.gz/$yy"
          printf '%s  %s\n' 8dadd7d2536a314f982ad05a651b713f426bf7d02cc2c76cffb9796f2218e6c5 curl.tar.xz \
            13d53411c9d818836a2dc0b3f4be40c34ee4e0fcd21ff903e0aebbfd52e9e08d yyjson.tar.gz | sha256sum -c
          tar xf curl.tar.xz && tar xf yyjson.tar.gz
          cmake -S curl-8.23.0 -B curl-build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$deps" \
            -DBUILD_SHARED_LIBS=OFF -DBUILD_CURL_EXE=OFF -DBUILD_TESTING=OFF -DBUILD_EXAMPLES=OFF \
            -DBUILD_LIBCURL_DOCS=OFF -DBUILD_MISC_DOCS=OFF -DCURL_ENABLE_SSL=OFF -DCURL_USE_LIBPSL=OFF \
            -DCURL_USE_LIBSSH2=OFF -DCURL_ZLIB=OFF -DCURL_BROTLI=OFF -DCURL_ZSTD=OFF -DUSE_NGHTTP2=OFF \
            -DUSE_LIBIDN2=OFF -DCURL_DISABLE_LDAP=ON
          cmake --build curl-build --parallel && cmake --install curl-build
          cmake -S "yyjson-$yy" -B yyjson-build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$deps"
          cmake --build yyjson-build --parallel && cmake --install yyjson-build
          python3 -m venv "$deps/mcp-venv" && "$deps/mcp-venv/bin/pip" install -q mcp==2.3.0
          echo "YAN_DEPS=$deps" >> "$GITHUB_ENV"
      - name: Configure (Linux, Guest)
        if: runner.os == 'Linux'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.config }} -DYAN_ENABLE_SANITIZERS=${{ matrix.sanitizers }} -DYAN_BUILD_TOOLS=ON -DYAN_RISCV_PREFIX=riscv64-linux-gnu- -DYAN_BUILD_SEMANTIC=ON -DYAN_ENABLE_MUTATION_TESTS=ON -DCMAKE_PREFIX_PATH="$YAN_DEPS" -DYAN_MCP_SDK_PYTHON="$YAN_DEPS/mcp-venv/bin/python"
      - name: Check Guest toolchain and registration
        if: runner.os == 'Linux'
        shell: bash
        run: |
          gcc_path=$(sed -n 's/^YAN_RISCV_GCC:FILEPATH=//p' build/CMakeCache.txt)
          if [ -z "$gcc_path" ] || [ ! -x "$gcc_path" ]; then
            echo "::error::工具链未找到：YAN_RISCV_GCC='${gcc_path}'"
            exit 1
          fi
          grep -E '^(YAN_RISCV_GCC:FILEPATH|YAN_BUILD_TOOLS:BOOL)=' build/CMakeCache.txt
          guest_count=$(ctest --test-dir build -N -R '^guest_' | sed -n 's/^Total Tests: //p')
          if [ -z "$guest_count" ] || [ "$guest_count" -eq 0 ]; then
            echo "::error::Guest 测试未注册：ctest -N -R '^guest_' 为 0"
            exit 1
          fi
          echo "Guest 测试注册数：$guest_count"
          mcp_count=$(ctest --test-dir build -N -R '^(mcp_note|mcp_note_tool|mcp_stdio|mcp_sdk)$' | sed -n 's/^Total Tests: //p')
          if [ "$mcp_count" != 4 ]; then
            echo "::error::MCP write tests not registered: $mcp_count/4 (#42)"
            exit 1
          fi
          performance_count=$(ctest --test-dir build -N -R '^(yanfs_4095_performance_harness|yanfs_4095_performance)$' | sed -n 's/^Total Tests: //p')
          if [ "$performance_count" != 2 ]; then
            echo "::error::4095 performance tests not registered: $performance_count/2 (#90)"
            exit 1
          fi
      - name: Build
        run: cmake --build build --config ${{ matrix.config }} --parallel
      - name: Test
        if: runner.os != 'Linux'
        run: ctest --test-dir build --build-config ${{ matrix.config }} --output-on-failure
      - name: Test (Linux, no skips)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -o pipefail
          ctest --test-dir build -N | sed -n 's/^  Test *#[0-9]*: //p' | sort
          # The mutation groups are registered (YAN_ENABLE_MUTATION_TESTS is ON
          # for Linux) but run in their own step below; exclude only the real
          # mutation items here. The `_mutation_classifier` / `_mutation_gate`
          # judges stay in the default suite on purpose: they are cheap pure
          # classifier checks, and CONTRIBUTING relies on them being present.
          # -V: a passing test prints its measured numbers only in verbose mode,
          # so this one full run carries the stdout that separate re-runs used to
          # fetch (Issue #75, Issue #178).
          ctest --test-dir build --build-config ${{ matrix.config }} -E '_mutation$' -V --output-on-failure 2>&1 | tee ctest.log
          cp build/Testing/Temporary/LastTest.log build/Testing/Temporary/LastTest-full.log
          if [ ! -f ctest.log ]; then
            echo "::error::ctest 日志不存在"
            exit 1
          fi
          # Match a CTest SUMMARY "(Skipped)" row only: "<n> - <name> (Skipped)".
          # A bare token match also hits a passing test's own stdout, now visible
          # because the full run is verbose (Issue #178 R1; 0034 R4).
          if grep -E '^[[:space:]]*[0-9]+ - .*\(Skipped\)' ctest.log; then
            echo "::error::存在被跳过的测试（见上方列表）"
            exit 1
          fi
      # The real mutation check: it compiles each mutant, swaps it into a
      # scratch copy of the source and runs the suite, so a green result here
      # means the tests actually detect these defects. Measured on the Release
      # configuration: yanfs_mutation = 19 mutants in 19 s. Registered only
      # under YAN_ENABLE_MUTATION_TESTS, which the Configure step sets for
      # Linux; CONTRIBUTING documents the same flag for local runs.
      - name: Mutation (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -o pipefail
          ctest --test-dir build --build-config ${{ matrix.config }} -R '^yanfs_mutation$' --output-on-failure 2>&1 | tee mutation.log
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-evidence-${{ matrix.os }}-${{ matrix.config }}-sanitizers-${{ matrix.sanitizers }}
          path: |
            ctest.log
            mutation.log
            build/Testing/Temporary/
            build/yanfs-4095-performance/
            build/CMakeCache.txt
          retention-days: 14
          if-no-files-found: error
